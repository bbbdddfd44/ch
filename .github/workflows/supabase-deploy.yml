name: Deploy Supabase (functions + migrations)

on:
  push:
    branches: [main, agents/hi]
    paths:
      - "frontend/supabase/functions/**"
      - "frontend/supabase/migrations/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # GitHub Actions doesn't allow the `secrets` context directly inside an
      # `if:` conditional — it fails to parse with "Unrecognized named-value:
      # 'secrets'". Map it to a job-level env var here, then check env.* below.
      HAS_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
      HAS_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
      HAS_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        run: |
          echo "SUPABASE_ACCESS_TOKEN present: $HAS_ACCESS_TOKEN"
          echo "SUPABASE_PROJECT_ID present: $HAS_PROJECT_ID"
          echo "SUPABASE_DB_PASSWORD present: $HAS_DB_PASSWORD"
          if [ "$HAS_ACCESS_TOKEN" != "true" ] || [ "$HAS_PROJECT_ID" != "true" ]; then
            echo "::error::One or more required secrets (SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID) are not set on this repository. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Link project
        working-directory: frontend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      # Applies any new migration files in frontend/supabase/migrations
      # against the live project database. Skipped if SUPABASE_DB_PASSWORD
      # is not set (functions still deploy either way).
      - name: Push database migrations
        if: ${{ env.HAS_DB_PASSWORD == 'true' }}
        working-directory: frontend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all

      - name: Deploy edge functions
        working-directory: frontend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in access-admin access-agency access-auth access-wallet svp-auth svp-proxy takamol-proxy svp-registration test-center-owner; do
            echo "── Deploying $fn ──"
            supabase functions deploy "$fn" --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          done
